# Native development environment:  conda env create -f environment.yml
# Python packages come from backend/requirements.txt (the same pins as the Docker image and CI).
name: flask
channels:
  - conda-forge
dependencies:
  - python=3.12
  - postgresql=15        # optional: local database server for development and tests
  - nodejs=22            # frontend tooling (LTS)
  - pip
  - pip:
      - -r backend/requirements.txt
