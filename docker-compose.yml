services:

  database:
    restart: unless-stopped
    # Debian-based like before: switching to Alpine changes text collation and can corrupt indexes
    image: postgres:15.19
    env_file: ${ENV_FILE:-.env}
    volumes:
      - eln_db:/var/lib/postgresql/data/
    # bound to localhost only: reachable from the host for development, not from the network
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - eln

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ${ENV_FILE:-.env}
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      # attachments are streamed by nginx after Django's permission check
      - ATTACHMENT_X_ACCEL_PREFIX=/protected-attachments/
    # localhost only: external traffic must go through nginx
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      # Source bind mount: keeps the migrations generated at startup on the host. Remove it
      # once migrations are committed (see README "Database migrations").
      - ./backend:/app
      - static:/app/static
      - media:/app/media
      - private_media:/app/private_media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s   # migrations and collectstatic run before gunicorn starts
    networks:
      - eln

  nginx:
    restart: unless-stopped
    # nginx with the built SPA baked in (multi-stage build in frontend/Dockerfile)
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static:/static:ro
      - media:/media:ro
      - private_media:/private_media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # checks the whole chain: nginx -> Django -> PostgreSQL
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eln

  backup:
    restart: unless-stopped
    # same server version as `database`, so pg_dump matches it
    image: postgres:15.19
    env_file: ${ENV_FILE:-.env}
    environment:
      - PGHOST=database
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
      - media:/data/media:ro
      - private_media:/data/private_media:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # healthy while the last successful backup, or the container start, is under 26 hours old:
      # unhealthy means no backup has succeeded for more than a day
      test: ["CMD-SHELL", "find /backups/LAST_SUCCESS /tmp/backup-service-started -mmin -1560 2>/dev/null | grep -q ."]
      interval: 5m
      timeout: 10s
      start_period: 30s
      start_interval: 5s
    networks:
      - eln

  # On-demand tool, not started by `up`: used by scripts/restore.sh.
  restore:
    profiles: ["tools"]
    image: postgres:15.19
    env_file: ${ENV_FILE:-.env}
    environment:
      - PGHOST=database
    entrypoint: ["/bin/sh", "/scripts/restore-in-container.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups:ro
      - media:/data/media
      - private_media:/data/private_media
    depends_on:
      database:
        condition: service_healthy
    networks:
      - eln

volumes:
  eln_db:
  static:
  media:
  private_media:
  backups:

networks:
  eln:
