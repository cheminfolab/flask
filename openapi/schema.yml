openapi: 3.0.3
info:
  title: FLASK ELN API
  version: 0.1.0
  description: Electronic lab notebook and chemical inventory. The frontend TypeScript
    types are generated from this schema.
paths:
  /api/attachments/:
    get:
      operationId: attachments_list
      description: |-
        Files are stored outside the public media directory and only served by
        `download`, after the same read check as the experiment.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttachmentList'
          description: ''
    post:
      operationId: attachments_create
      description: |-
        Files are stored outside the public media directory and only served by
        `download`, after the same read check as the experiment.
      tags:
      - attachments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/attachments/{id}/:
    get:
      operationId: attachments_retrieve
      description: |-
        Files are stored outside the public media directory and only served by
        `download`, after the same read check as the experiment.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    delete:
      operationId: attachments_destroy
      description: |-
        Files are stored outside the public media directory and only served by
        `download`, after the same read check as the experiment.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/attachments/{id}/download/:
    get:
      operationId: attachments_download_retrieve
      description: |-
        Files are stored outside the public media directory and only served by
        `download`, after the same read check as the experiment.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: The file, always as a download.
