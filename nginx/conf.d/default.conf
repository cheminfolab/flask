# Access log with the request id that is also passed to (and logged by) Django,
# so a request can be followed from nginx to the application logs.
log_format main_rid '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rid=$request_id rt=$request_time';

server {
	listen 80;
	listen [::]:80;

	access_log /var/log/nginx/access.log main_rid;

	# must be at least ATTACHMENT_MAX_SIZE_MB (default 100)
	client_max_body_size 100m;

	# server_name

	# headers forwarded to Django. X-Forwarded-For is *appended* to, and Django trusts
	# only the last entry (NUM_PROXIES=1), so clients cannot spoof their address.
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Request-ID $request_id;

	location /api/ {
		proxy_pass http://backend:8000/api/;
	}

	location /admin/ {
		proxy_pass http://backend:8000/admin/;
	}

	location /static/ {
		root /;
	}

	location /media/ {
		root /;
		add_header X-Content-Type-Options nosniff always;
	}

	# Experiment attachments: only reachable via X-Accel-Redirect from Django,
	# after the permission check. Direct requests return 404.
	location /protected-attachments/ {
		internal;
		alias /private_media/;
		# nginx keeps only Content-Type/-Disposition and cache headers from Django's response
		# when following X-Accel-Redirect, so repeat the protective headers here
		add_header X-Content-Type-Options nosniff always;
		add_header Content-Security-Policy "default-src 'none'; sandbox" always;
	}

	location / {
		root /var/www/frontend;
		try_files $uri $uri/ /index.html;
		add_header X-Content-Type-Options nosniff always;
		add_header X-Frame-Options DENY always;
		add_header Referrer-Policy same-origin always;
	}
}
